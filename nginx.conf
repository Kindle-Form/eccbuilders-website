# Processed by the official nginx image entrypoint. ${PORT} comes from the
# environment (default 80 in the Dockerfile). Other $variables are nginx's.
server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /index.html {
        return 301 /;
    }

    # 301s from the public eccbuilders.com paths audited on 12 November 2026.
    location = /about-us { return 301 /about/; }
    location = /about-us/ { return 301 /about/; }
    location = /luxury-residences { return 301 /services/luxury-residences/; }
    location = /luxury-residences/ { return 301 /services/luxury-residences/; }
    location = /commercial { return 301 /services/commercial/; }
    location = /commercial/ { return 301 /services/commercial/; }
    location = /tenant-improvements { return 301 /services/tenant-improvements/; }
    location = /tenant-improvements/ { return 301 /services/tenant-improvements/; }
    location = /luxury-renovations { return 301 /services/luxury-renovations/; }
    location = /luxury-renovations/ { return 301 /services/luxury-renovations/; }
    location = /houses-of-worship { return 301 /services/houses-of-worship/; }
    location = /houses-of-worship/ { return 301 /services/houses-of-worship/; }
    location = /testimonials { return 301 /reviews/; }
    location = /testimonials/ { return 301 /reviews/; }
    location = /contact-us { return 301 /contact/; }
    location = /contact-us/ { return 301 /contact/; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 7d;
    }
}
